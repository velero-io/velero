---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: downloadrequests.velero.io
spec:
  group: velero.io
  names:
    kind: DownloadRequest
    listKind: DownloadRequestList
    plural: downloadrequests
    shortNames:
    - dreq
    singular: downloadrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The type of file to download
      jsonPath: .spec.target.kind
      name: Target Kind
      type: string
    - description: The name of the resource the file is associated with
      jsonPath: .spec.target.name
      name: Target Name
      type: string
    - description: The status of the download request
      jsonPath: .status.phase
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          DownloadRequest is a request to download an artifact from backup object storage, such as a backup
          log file.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DownloadRequestSpec is the specification for a download request.
            properties:
              target:
                description: Target is what to download (e.g. logs for a backup).
                properties:
                  kind:
                    description: Kind is the type of file to download.
                    enum:
                    - BackupLog
                    - BackupContents
                    - BackupVolumeSnapshots
                    - BackupItemOperations
                    - BackupResourceList
                    - BackupResults
                    - RestoreLog
                    - RestoreResults
                    - RestoreResourceList
                    - RestoreItemOperations
                    - CSIBackupVolumeSnapshots
                    - CSIBackupVolumeSnapshotContents
                    - BackupVolumeInfos
                    - RestoreVolumeInfo
                    type: string
                  name:
                    description: Name is the name of the Kubernetes resource with
                      which the file is associated.
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - target
            type: object
          status:
            description: DownloadRequestStatus is the current status of a DownloadRequest.
            properties:
              downloadURL:
                description: |-
                  DownloadURL contains the pre-signed URL for the target file. It is signed for a fixed
                  lifetime and expires at Expiration, so it should be used promptly and not cached.
                type: string
              expiration:
                description: Expiration is when this DownloadRequest expires and can
                  be deleted by the system.
                format: date-time
                nullable: true
                type: string
              phase:
                description: |-
                  Phase is the current state of the DownloadRequest. Processed means a URL has been
                  signed into DownloadURL. It does not mean the target object exists in object storage,
                  so a request whose target never produced a file still reaches Processed and the URL
                  returns 404. Callers should check that the backup or restore is in a phase that
                  produces the target before relying on the download.
                enum:
                - New
                - Processed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
