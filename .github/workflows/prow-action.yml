# Adds support for prow-like commands
# Uses .github/labels.yaml to define areas and kinds
name: "Prow github actions"
on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  execute:
    if: github.repository == 'velero-io/velero'
    runs-on: ubuntu-latest
    steps:
      - uses: jpmcb/prow-github-actions@187c5e3cd95a329c43448e1bdb3b1f5249232e44 # v3.0.1
        with:
          # TODO: before allowing the /lgtm command, see if we can block merging if changelog labels are missing.
          prow-commands: |
            /approve
            /area
            /assign
            /cc
            /close
            /hold
            /kind
            /milestone
            /retitle
            /remove
            /reopen
            /uncc
            /unassign
          github-token: "${{ secrets.GITHUB_TOKEN }}"
