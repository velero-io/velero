version: 2
updates:
  # Dependencies listed in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "Dependencies"
      - "github_actions"
      - "kind/changelog-not-required"
  # Dependencies listed in go.mod
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    labels:
      - "Dependencies"
      - "go"
      - "kind/changelog-not-required"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  # Dependencies listed in pkg/apis/go.mod
  - package-ecosystem: "gomod"
    directory: "/pkg/apis" # Location of package manifests
    schedule:
      interval: "weekly"
    labels:
      - "Dependencies"
      - "go"
      - "kind/changelog-not-required"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  # Runtime base image pinned in the Dockerfile of each supported release branch.
  # `main` uses the floating `latest` tag and needs no entry.
  # Dependabot reads this file from the default branch only and cannot compute
  # `target-branch`, so the entries below are regenerated by the
  # "Update Dependabot release branches" workflow when a new minor is released.
  # BEGIN generated by hack/update-dependabot-release-branches.sh, do not edit by hand
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "release-1.18"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "paketobuildpacks/run-jammy-tiny"
      - dependency-name: "paketobuildpacks/ubuntu-noble-run-tiny"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "Dependencies"
      - "kind/changelog-not-required"
    commit-message:
      prefix: "[release-1.18]"
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "release-1.17"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "paketobuildpacks/run-jammy-tiny"
      - dependency-name: "paketobuildpacks/ubuntu-noble-run-tiny"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "Dependencies"
      - "kind/changelog-not-required"
    commit-message:
      prefix: "[release-1.17]"
  # END generated by hack/update-dependabot-release-branches.sh
